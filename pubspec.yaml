name: worktrack
description: Employee Attendance Tracker with GPS

version: 1.0.3+7

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  geolocator: ^11.0.0        # GPS location
  http: ^1.2.1               # API calls
  shared_preferences: ^2.2.3  # Token storage
  intl: ^0.19.0              # Date formatting
  url_launcher: ^6.2.5
dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/monarch_logo.png"

